name: Daily IPO update

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST every day (GitHub may start it a few minutes late)
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-ipo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run parser tests
        run: python -m pytest -q

      - name: Scrape and build page
        run: python -m scraper.build

      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update IPO data $(TZ=Asia/Kolkata date '+%d %b %Y')"
            git push
          fi
